name: Build, test, and publish

on:
  push:
    branches:
      - master
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build:
    name: Build and verify
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Verify release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./Directory.Build.props
          $version = [string](
            $props.Project.PropertyGroup |
              ForEach-Object { $_.VersionPrefix } |
              Where-Object { $_ } |
              Select-Object -First 1
          )

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props does not contain VersionPrefix."
          }

          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' must match VersionPrefix '$version' as '$expectedTag'."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA origin/master
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag '$env:GITHUB_REF_NAME' must point to a commit contained in origin/master."
          }

      - name: Restore product and tests
        run: dotnet restore ./Essential.Culture.slnx

      - name: Restore demos
        run: dotnet restore ./demo/Essential.Culture.Demo.slnx -p:UseLocalCulture=true

      - name: Build product and tests
        run: >-
          dotnet build ./Essential.Culture.slnx
          --configuration Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:ContinuousIntegrationBuild=true

      - name: Run tests
        run: >-
          dotnet test ./Essential.Culture.slnx
          --configuration Release
          --no-build
          --no-restore

      - name: Build demos
        run: >-
          dotnet build ./demo/Essential.Culture.Demo.slnx
          --configuration Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true
          -p:ContinuousIntegrationBuild=true
          -p:UseLocalCulture=true

      - name: Pack NuGet packages
        run: >-
          dotnet pack ./Essential.Culture.slnx
          --configuration Release
          --no-build
          --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: Validate package set
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./Directory.Build.props
          $version = [string](
            $props.Project.PropertyGroup |
              ForEach-Object { $_.VersionPrefix } |
              Where-Object { $_ } |
              Select-Object -First 1
          )

          $expected = @(
            "Arkheide.Essential.Culture.$version.nupkg"
            "Arkheide.Essential.Culture.Generator.$version.nupkg"
            "Arkheide.Essential.Culture.Wpf.$version.nupkg"
            "Arkheide.Essential.Culture.Avalonia.$version.nupkg"
            "Arkheide.Essential.Culture.WinUI.$version.nupkg"
          ) | Sort-Object

          $actual = @(
            Get-ChildItem ./artifacts/packages -Filter *.nupkg -File |
              Select-Object -ExpandProperty Name
          ) | Sort-Object

          $difference = Compare-Object $expected $actual
          if ($difference) {
            Write-Host "Expected packages:"
            $expected | ForEach-Object { Write-Host "  $_" }
            Write-Host "Actual packages:"
            $actual | ForEach-Object { Write-Host "  $_" }
            throw "The generated NuGet package set is incomplete or contains unexpected packages."
          }

      - name: Upload NuGet packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: nuget
    concurrency:
      group: nuget-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Resolve package version
        shell: pwsh
        run: |
          [xml]$props = Get-Content ./Directory.Build.props
          $version = [string](
            $props.Project.PropertyGroup |
              ForEach-Object { $_.VersionPrefix } |
              Where-Object { $_ } |
              Select-Object -First 1
          )

          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Directory.Build.props does not contain VersionPrefix."
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Sign in to NuGet.org with Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(
            "artifacts/packages/Arkheide.Essential.Culture.Generator.$env:PACKAGE_VERSION.nupkg"
            "artifacts/packages/Arkheide.Essential.Culture.$env:PACKAGE_VERSION.nupkg"
            "artifacts/packages/Arkheide.Essential.Culture.Wpf.$env:PACKAGE_VERSION.nupkg"
            "artifacts/packages/Arkheide.Essential.Culture.Avalonia.$env:PACKAGE_VERSION.nupkg"
            "artifacts/packages/Arkheide.Essential.Culture.WinUI.$env:PACKAGE_VERSION.nupkg"
          )

          foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package)) {
              throw "Package '$package' was not found."
            }

            dotnet nuget push $package `
              --api-key $env:NUGET_API_KEY `
              --source $env:NUGET_SOURCE `
              --skip-duplicate

            if ($LASTEXITCODE -ne 0) {
              throw "Publishing '$package' failed with exit code $LASTEXITCODE."
            }
          }
