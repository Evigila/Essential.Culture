name: Build, test, and publish

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

jobs:
  build:
    name: Build and verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Verify release tag and branch ancestry
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          . ./scripts/Release-Common.ps1
          Assert-ReleaseTag $env:GITHUB_REF_NAME $env:GITHUB_SHA
      - name: Restore, build, test, and pack all packages
        shell: pwsh
        run: ./scripts/Test-Release.ps1
      - name: Upload verified NuGet packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    environment: nuget
    concurrency:
      group: nuget-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Download verified NuGet packages
        uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Verify downloaded packages
        shell: pwsh
        run: ./scripts/Verify-PackageSet.ps1
      - name: Sign in with Trusted Publishing
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
      - name: Publish packages in dependency order
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          . ./scripts/Release-Common.ps1
          $version = Get-ReleaseVersion
          foreach ($package in $ReleaseSettings.Packages) {
            Invoke-ReleaseCommand dotnet @('nuget', 'push', "artifacts/packages/$($package.Id).$version.nupkg",
              '--api-key', $env:NUGET_API_KEY, '--source', $env:NUGET_SOURCE, '--skip-duplicate')
          }
